name: CI Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.14']
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Exécuter les tests Python
        shell: pwsh
        run: python -B -m unittest discover -s .\Tests -p 'test_*.py' -v

  node:
    name: Extension VS Code
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Exécuter les tests Node.js
        working-directory: VSCode/scripts-perso-context
        run: npm test

  powershell:
    name: PowerShell 5.1 et 7
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Configurer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Exécuter les scénarios PowerShell
        shell: pwsh
        run: |
          $runs = @(
            @{ Shell = 'powershell.exe'; File = '.\Tests\test-lanceur.ps1' },
            @{ Shell = 'pwsh.exe';       File = '.\Tests\test-lanceur.ps1' },
            @{ Shell = 'powershell.exe'; File = '.\Tests\test-diagnostic-developpeur.ps1' },
            @{ Shell = 'pwsh.exe';       File = '.\Tests\test-diagnostic-developpeur.ps1' },
            @{ Shell = 'powershell.exe'; File = '.\Tests\test-serveurs-locaux.ps1' },
            @{ Shell = 'pwsh.exe';       File = '.\Tests\test-serveurs-locaux.ps1' },
            @{ Shell = 'pwsh.exe';       File = '.\Tests\test-centre-pwsh.ps1' },
            @{ Shell = 'powershell.exe'; File = '.\Tests\test-assistant-ollama.ps1' },
            @{ Shell = 'pwsh.exe';       File = '.\Tests\test-assistant-ollama.ps1' },
            @{ Shell = 'powershell.exe'; File = '.\Tests\test-commit.ps1' },
            @{ Shell = 'pwsh.exe';       File = '.\Tests\test-commit.ps1' }
          )

          foreach ($run in $runs) {
            Write-Host "`n> $($run.Shell) $($run.File)"
            & $run.Shell -NoProfile -NonInteractive -File $run.File
            if ($LASTEXITCODE -ne 0) {
              throw "$($run.File) a échoué sous $($run.Shell)."
            }
          }
